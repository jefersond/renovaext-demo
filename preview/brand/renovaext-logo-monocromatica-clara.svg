  <path d="M 118 232 A 144 144 0 0 1 372 152" fill="none" stroke="#102126" stroke-width="28" stroke-linecap="round"/>
  <path d="M 332 156 L 380 156 L 380 108" fill="none" stroke="#102126" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arco inferior de renovacao continua -->
  <path d="M 394 280 A 144 144 0 0 1 140 360" fill="none" stroke="#102126" stroke-width="28" stroke-linecap="round"/>
  <path d="M 180 356 L 132 356 L 132 404" fill="none" stroke="#102126" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cilindro de Extintor de Incendio Central -->
  <rect x="206" y="206" width="100" height="142" rx="34" fill="#102126"/>
  <!-- Base tecnica de calendario/agenda no corpo do extintor (6 pontos de agenda) -->
  <circle cx="234" cy="268" r="6.5" fill="#ffffff"/>
  <circle cx="256" cy="268" r="6.5" fill="#ffffff"/>
  <circle cx="278" cy="268" r="6.5" fill="#ffffff"/>
  <circle cx="234" cy="292" r="6.5" fill="#ffffff"/>
  <circle cx="256" cy="292" r="6.5" fill="#ffffff"/>
  <circle cx="278" cy="292" r="6.5" fill="#ffffff"/>
  <!-- Valvula e manometro superior do extintor -->
  <rect x="238" y="176" width="36" height="34" rx="7" fill="#102126"/>
  <circle cx="256" cy="192" r="7" fill="#102126"/>
  <!-- Alavanca de acionamento e difusor -->
  <path d="M 220 172 L 296 172 L 316 156" fill="none" stroke="#102126" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mangueira lateral do extintor -->
  <path d="M 208 228 Q 174 236 172 284" fill="none" stroke="#102126" stroke-width="14" stroke-linecap="round"/>

  </g>
  <text x="246" y="128" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2.5" fill="#ffffff">RenovaExt</text>
  <text x="250" y="174" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.8" fill="#ffffff">AGENDA E RENOVAÇÕES PARA EMPRESAS DE EXTINTORES</text>
