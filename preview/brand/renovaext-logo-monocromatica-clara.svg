<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 240" width="1080" height="240" fill="none">
  <rect x="0" y="0" width="1080" height="240" rx="32" fill="#102126"/>
  <g transform="translate(20, 20) scale(0.390625)">
    
  <!-- Fundo arredondado do icone -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="#ffffff"/>
